<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CROFF: vanilla example</title>
    <link rel="stylesheet" href="dist/croff.css" />
  </head>
  <body class="bg(dark) color(light) font(sans) min-height(screen)">
    <main class="max-width[42rem] margin(0,auto) padding(6) md:padding(12) flex(col) gap(6)">
      <h1 class="text-size(4xl) text-weight(bold) line-height(tight)">Style without the noise.</h1>
      <p class="color(muted) text-size(lg) line-height(relaxed)">
        This page is plain HTML. Its stylesheet was generated by the
        <code class="font(mono) color(brand)">croff</code> CLI from the classes you see in the
        source.
      </p>
      <div class="columns(1) sm:columns(3) display(grid) gap(4)">
        <div class="padding(4) border(1,gray-700) radius(md)">Parse</div>
        <div class="padding(4) border(1,gray-700) radius(md)">Compile</div>
        <div class="padding(4) border(1,gray-700) radius(md)">Ship</div>
      </div>
      <button
        class="bg(brand) color(dark) text-weight(semibold) padding(3,6) radius(sm) width(fit) transition(colors) hover:bg(brand-dark) focus-visible:ring(2,light)"
      >
        Get started
      </button>
    </main>
  </body>
</html>
